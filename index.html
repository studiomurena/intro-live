<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Murena - Intro Live</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden; 
            font-family: 'VT323', monospace;
        }

        /* --- STILE TERMINALE DOS --- */
        #terminale {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            padding: 50px;
            box-sizing: border-box;
            z-index: 10; 
        }

        .testo-bianco { color: #fff; font-size: 40px; }
        .testo-verde { color: #39ff14; font-size: 45px; text-shadow: 0 0 8px rgba(57, 255, 20, 0.5); }
        .testo-verde-grande { color: #39ff14; font-size: 65px; text-shadow: 0 0 10px rgba(57, 255, 20, 0.8); }
        .testo-rosso { color: #ff003c; font-size: 60px; text-shadow: 0 0 15px rgba(255, 0, 60, 0.8); font-weight: bold; }
        
        #cursore {
            display: inline-block;
            width: 25px; height: 45px;
            background-color: #fff;
            animation: lampeggia 1s step-end infinite;
            vertical-align: bottom;
        }

        @keyframes lampeggia { 50% { opacity: 0; } }

        /* --- EFFETTO GLITCH DEVASTANTE --- */
        .glitch-attivo {
            animation: glitch-anim 0.2s infinite;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) scale(1); filter: hue-rotate(0deg); letter-spacing: normal; }
            20% { transform: translate(-15px, 15px) scale(1.05); filter: invert(1); color: red; letter-spacing: 5px; }
            40% { transform: translate(15px, -15px) scale(1.1) skew(10deg); }
            60% { transform: translate(-25px, 0) scale(1.2); filter: hue-rotate(180deg); color: blue; }
            80% { transform: translate(25px, 15px) scale(1.3) skew(-15deg); filter: blur(4px); }
            100% { transform: translate(0) scale(1.5); opacity: 0; }
        }

        /* --- PIOGGIA MATRIX --- */
        #matrix-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5; /* Dietro al terminale, pronto ad apparire */
            display: none; /* Nascosto all'inizio */
        }

        /* --- FLASH LUMINOSO FINALE --- */
        #flash-luce {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #fff;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out; /* Flash velocissimo */
        }
    </style>
</head>
<body>

    <!-- IL TERMINALE DOS -->
    <div id="terminale">
        <span id="testo-schermo"></span><span id="cursore"></span>
    </div>

    <!-- IL CANVAS PER LA PIOGGIA MATRIX -->
    <canvas id="matrix-canvas"></canvas>

    <!-- IL FLASH FINALE CHE ILLUMINA IL LOCALE -->
    <div id="flash-luce"></div>

    <script>
        // ==========================================
        // PANNELLO DI CONTROLLO
        // ==========================================
        const MODALITA_TEST = true; // Metti FALSE per la durata reale di 1 minuto
        const mTempo = MODALITA_TEST ? 0.1 : 1; 

        // Elementi della pagina
        const terminaleDiv = document.getElementById('terminale');
        const testoSchermo = document.getElementById('testo-schermo');
        const cursore = document.getElementById('cursore');
        const canvasMatrix = document.getElementById('matrix-canvas');
        const flashLuce = document.getElementById('flash-luce');

        const pausa = (ms) => new Promise(resolve => setTimeout(resolve, ms * mTempo));

        async function scrivi(testo, classeCss, ritardoTasto = 40) {
            let bloccoTesto = document.createElement('span');
            bloccoTesto.className = classeCss;
            testoSchermo.appendChild(bloccoTesto);
            cursore.style.backgroundColor = getComputedStyle(bloccoTesto).color;

            for (let i = 0; i < testo.length; i++) {
                if (testo[i] === '\n') {
                    bloccoTesto.appendChild(document.createElement('br'));
                } else {
                    bloccoTesto.innerHTML += testo[i];
                }
                let randomRitardo = ritardoTasto + (Math.random() * 20 - 10);
                await pausa(randomRitardo);
            }
        }

        async function avviaIntro() {
            // 0:00 - 0:10 | IL FALSO BOOT
            await scrivi("MURENA_OS v.9.5.1 BIOS Revision 4.2\n", "testo-bianco", 10);
            await pausa(500);
            await scrivi("Checking RAM... 640K OK\n", "testo-bianco", 10);
            await pausa(600);
            await scrivi("Loading audio drivers... OK\n", "testo-bianco", 10);
            await pausa(1000);
            await scrivi("Loading instruments... ", "testo-bianco", 20);
            await pausa(1500);
            await scrivi("FATAL ERROR.\n", "testo-bianco", 10);
            await pausa(2000); 
            
            testoSchermo.innerHTML = "";
            await pausa(1500);

            // 0:10 - 0:30 | L'ANALISI DELL'IA
            await scrivi("> INIZIALIZZAZIONE PROTOCOLLO DI PURGA.\n", "testo-verde", 50);
            await pausa(1000);
            await scrivi("> RILEVAMENTO ANOMALIE SUL PALCO...\n", "testo-verde", 50);
            await pausa(800);
            await scrivi("> Target agganciati: CARMA, FERRAZ, MAURI, NAN, FALCON.\n", "testo-verde", 30);
            await pausa(1200);
            await scrivi("> Analisi composizione: 70% Acqua, 30% Materia deperibile.\n", "testo-verde", 40);
            await pausa(1500);
            await scrivi("> ERRORE: LA CARNE È DEBOLE. IL JAZZ RICHIEDE PERFEZIONE DIGITALE.\n", "testo-verde", 60);
            await pausa(3000);

            // 0:30 - 0:45 | LA SFIDA
            testoSchermo.innerHTML = ""; 
            await scrivi("SISTEMA COMPROMESSO.\n", "testo-verde-grande", 60);
            await scrivi("Per suonare stasera dovete abbandonare i vostri corpi.\n", "testo-verde-grande", 60);
            await scrivi("Accettate la digitalizzazione?\n", "testo-verde-grande", 60);
            await scrivi("Digitare [Y] per trascendere - [N] per essere cancellati.\n", "testo-verde-grande", 60);
            await scrivi("> ", "testo-verde-grande", 10);
            
            await pausa(5000); // Suspense...

            // 0:45 - 0:55 | L'OVERRIDE
            await scrivi("Y\n", "testo-rosso", 100);
            await pausa(500);
            await scrivi("> INIZIALIZZAZIONE UPLOAD...\n", "testo-rosso", 20);
            await pausa(800);
            await scrivi("> ATTENZIONE: FILE TROPPO PESANTI.\n", "testo-rosso", 20);
            await pausa(800);
            await scrivi("> OVERRIDE DI SISTEMA IN CORSO...\n", "testo-rosso", 10);
            await pausa(1000);
            await scrivi("> NOI NON VENIAMO CANCELLATI.\n", "testo-rosso", 80);
            await pausa(1000);
            await scrivi("> NOI SIAMO I JAZZ HIGHLANDER.", "testo-rosso", 100);

            // 0:55 - 1:00 | IL COLLASSO & MATRIX RAIN
            await pausa(1000);
            
            // 1. Spacca lo schermo DOS (GLITCH)
            terminaleDiv.classList.add("glitch-attivo");
            
            // 2. Prepara la pioggia Matrix in background
            canvasMatrix.style.display = "block";
            avviaMatrixRain();

            // Lascia il glitch visibile per mezzo secondo, poi distrugge il DOS
            await pausa(800 * mTempo); 
            terminaleDiv.style.display = "none";

            // Lascia cadere la pioggia Matrix per un paio di secondi
            // NOTA: Questo NON è scalato dal mTempo così in test vedi l'effetto
            await new Promise(resolve => setTimeout(resolve, 2500)); 

            // 3. FLASH LUMINOSO FINALE CHE ACCECA IL LOCALE!
            flashLuce.style.opacity = "1";
            
            // Dopo il flash, puoi decidere di far tornare lo schermo nero 
            // o lasciarlo bianco scendendo piano di opacità.
            await new Promise(resolve => setTimeout(resolve, 150)); 
            
            // Lo facciamo tornare nero lentamente (perfetto per lo stacco prima del pezzo)
            flashLuce.style.transition = "opacity 2s ease-in";
            flashLuce.style.opacity = "0";
            canvasMatrix.style.display = "none"; // Spegne matrix
        }

        // ==========================================
        // MOTORE PIOGGIA MATRIX (CANVAS HTML5)
        // ==========================================
        function avviaMatrixRain() {
            const ctx = canvasMatrix.getContext('2d');
            canvasMatrix.width = window.innerWidth;
            canvasMatrix.height = window.innerHeight;

            const caratteri = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
            const fontSize = 24;
            const colonne = canvasMatrix.width / fontSize;
            const gocce = [];

            for(let x = 0; x < colonne; x++) {
                gocce[x] = 1;
            }

            function disegnaPioggia() {
                // Sfondo nero semi-trasparente per creare l'effetto scia
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvasMatrix.width, canvasMatrix.height);
                
                // Colore e font del codice
                ctx.fillStyle = '#39ff14'; // Verde fluo
                ctx.font = fontSize + 'px monospace';

                for(let i = 0; i < gocce.length; i++) {
                    const testo = caratteri.charAt(Math.floor(Math.random() * caratteri.length));
                    ctx.fillText(testo, i * fontSize, gocce[i] * fontSize);
                    
                    // Se la goccia esce dallo schermo e aggiungiamo un po' di random, riparte da zero
                    if(gocce[i] * fontSize > canvasMatrix.height && Math.random() > 0.975) {
                        gocce[i] = 0;
                    }
                    gocce[i]++;
                }
            }
            setInterval(disegnaPioggia, 33);
        }

        // START!
        avviaIntro();
    </script>
</body>
</html>
