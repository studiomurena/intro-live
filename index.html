<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Murena - Intro Live Jazz Highlander</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden; 
            font-family: 'VT323', monospace;
        }

        /* --- EFFETTI MONITOR CRT --- */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 900;
            pointer-events: none;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 4px 100%;
        }

        /* --- STILI TESTO --- */
        .testo-bios { color: #ffffff; font-size: 35px; opacity: 0.9; }
        
        .glow-verde {
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            font-size: 48px;
        }

        .glow-verde-cubitale {
            color: #00ff41;
            text-shadow: 0 0 15px #00ff41;
            font-size: 75px;
            line-height: 1.1;
        }

        .glow-codice {
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
            font-size: 40px;
        }

        /* ROSSO ALTO CONTRASTO - MENO LUMEN AI BORDI */
        .glow-highlander {
            color: #ff0000;
            text-shadow: 4px 4px 0px #440000; /* Ombra netta, non sfuocata */
            font-size: 115px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #terminale {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 60px;
            box-sizing: border-box;
            z-index: 10;
        }

        #container-centrale {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #cursore {
            display: inline-block;
            width: 25px; height: 45px;
            background-color: #00ff41;
            animation: lampeggia 1s step-end infinite;
            vertical-align: bottom;
        }

        @keyframes lampeggia { 50% { opacity: 0; } }

        /* --- GLITCH VELOCE (PER TRANSIZIONI) --- */
        .glitch-flash { animation: glitch-flash-anim 0.2s ease-out; }
        @keyframes glitch-flash-anim {
            0% { transform: translate(0); filter: invert(0); }
            30% { transform: translate(-50px, 20px) skewX(20deg); filter: invert(1); }
            60% { transform: translate(50px, -20px) scale(1.2); filter: hue-rotate(90deg); }
            100% { transform: translate(0); filter: invert(0); }
        }

        /* --- GLITCH FINALE (COLLASSO) --- */
        .glitch-attivo { animation: glitch-anim 0.15s infinite; }
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-30px, 20px) scale(1.1); filter: invert(1); }
            100% { transform: translate(0) scale(2); opacity: 0; }
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: none; }
        #flash-luce { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #fff; z-index: 9999; opacity: 0; }
    </style>
</head>
<body>

    <div id="crt-overlay"></div>

    <div id="terminale">
        <div id="area-dos">
            <span id="testo-dos"></span><span id="cursore"></span>
        </div>
        <div id="container-centrale"></div>
    </div>

    <canvas id="matrix-canvas"></canvas>
    <div id="flash-luce"></div>

    <script>
        // MODALITA_TEST = true per saltare i tempi lunghi durante le prove
        const MODALITA_TEST = false; 
        const mTempo = MODALITA_TEST ? 0.05 : 1; 

        const testoDos = document.getElementById('testo-dos');
        const containerCentrale = document.getElementById('container-centrale');
        const cursore = document.getElementById('cursore');
        const terminale = document.getElementById('terminale');
        const canvasMatrix = document.getElementById('matrix-canvas');
        const flashLuce = document.getElementById('flash-luce');

        const pausa = (ms) => new Promise(resolve => setTimeout(resolve, ms * mTempo));

        async function triggerGlitch() {
            terminale.classList.add('glitch-flash');
            await pausa(200);
            terminale.classList.remove('glitch-flash');
        }

        async function scrivi(testo, classeCss, target, velocita = 40) {
            let span = document.createElement('span');
            span.className = classeCss;
            target.appendChild(span);
            cursore.style.backgroundColor = getComputedStyle(span).color;
            if (classeCss.includes('verde')) cursore.style.boxShadow = `0 0 15px #00ff41`;
            else cursore.style.boxShadow = `none`;

            for (let char of testo) {
                if (char === '\n') span.appendChild(document.createElement('br'));
                else span.innerHTML += char;
                await pausa(velocita + (Math.random() * 20 - 10));
            }
        }

        async function avviaIntro() {
            // [ 1. INIZIALIZZAZIONE BIOS ]
            await scrivi("MURENA_OS v.9.5.1 BIOS Revision 4.2\n", "testo-bios", testoDos, 10);
            await pausa(500);
            await scrivi("Checking RAM... 640K OK\n", "testo-bios", testoDos, 10);
            await pausa(600);
            await scrivi("Loading audio drivers... OK\n", "testo-bios", testoDos, 10);
            await pausa(1000);
            await scrivi("Loading instruments... FATAL ERROR.\n", "testo-bios", testoDos, 20);
            await pausa(2000);

            // GLITCH TRANSIZIONE IA
            await triggerGlitch();
            testoDos.innerHTML = "";
            await pausa(500);

            // [ 2. ANALISI IA ]
            await scrivi("ERRORE DI SISTEMA: MATERIA ORGANICA RILEVATA.\n", "glow-verde", testoDos, 25);
            await pausa(1000);
            await scrivi("ANALISI IN CORSO: Carma, Ferrazzi, Gazzola, Nan, Falcon.\n", "glow-verde", testoDos, 25);
            await pausa(1500);
            await scrivi("STATO: Carne, ossa, sudore. OBSOLETI.\n", "glow-verde", testoDos, 50);
            await pausa(4000);

            // GLITCH TRANSIZIONE CENTRO
            await triggerGlitch();
            testoDos.innerHTML = "";
            await pausa(500);

            // [ 3. LA SFIDA CUBITALE ]
            await scrivi("LA REALTÀ È COMPROMESSA.\n", "glow-verde-cubitale", containerCentrale, 60);
            await pausa(1500);
            await scrivi("Per sopravvivere al collasso, dovete rinunciare al vostro corpo.\n", "glow-verde-cubitale", containerCentrale, 60);
            await pausa(2500);
            
            await scrivi("\nAvete il coraggio di abbandonare la materia e diventare puro codice?\n", "glow-verde", containerCentrale, 40);
            await scrivi("[Y] Accetta la digitalizzazione / [N] Muori nell'oblio\n", "glow-verde", containerCentrale, 40);
            await scrivi("In attesa di input... _", "glow-verde", containerCentrale, 10);
            
            await pausa(8000);

            // [ 4. OVERRIDE E RISPOSTA ]
            containerCentrale.innerHTML = "";
            await scrivi("> sudo force_override --target=CORE_SYSTEM --identity=JAZZ_HIGHLANDER\n", "glow-codice", containerCentrale, 15);
            await pausa(800);
            await scrivi("> FORZATURA DI SISTEMA INIZIATA...\n\n", "glow-verde", containerCentrale, 30);
            await pausa(2000);

            // NOI NON MORIAMO (ROSSO SOLIDO)
            await scrivi("NOI NON MORIAMO.\n", "glow-highlander", containerCentrale, 80);
            await pausa(2500);
            
            // NOI SIAMO I JAZZ HIGHLANDER
            await scrivi("NOI SIAMO I JAZZ HIGHLANDER.", "glow-highlander", containerCentrale, 110);

            // [ 5. COLLASSO FINALE ]
            await pausa(3000);
            terminale.classList.add("glitch-attivo");
            canvasMatrix.style.display = "block";
            avviaMatrixRain();

            await pausa(2000 * mTempo);
            terminale.style.display = "none";
            
            await new Promise(r => setTimeout(r, 3000));

            // FLASH
            flashLuce.style.opacity = "1";
            await pausa(200);
            flashLuce.style.transition = "opacity 3s ease-in";
            flashLuce.style.opacity = "0";
            await pausa(3000);
            canvasMatrix.style.display = "none";
        }

        function avviaMatrixRain() {
            const ctx = canvasMatrix.getContext('2d');
            canvasMatrix.width = window.innerWidth;
            canvasMatrix.height = window.innerHeight;
            const chars = 'JAZZHIGHLANDER01010101ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏ';
            const fontSize = 30;
            const columns = canvasMatrix.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvasMatrix.width, canvasMatrix.height);
                ctx.fillStyle = '#00ff41';
                ctx.font = fontSize + 'px monospace';
                drops.forEach((y, i) => {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    ctx.fillText(text, i * fontSize, y * fontSize);
                    if (y * fontSize > canvasMatrix.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                });
            }
            setInterval(draw, 33);
        }

        avviaIntro();
    </script>
</body>
</html>
