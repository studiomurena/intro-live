<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Murena - Intro Live Jazz Highlander</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden; 
            font-family: 'VT323', monospace;
        }

        /* --- EFFETTI MONITOR CRT --- */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 900;
            pointer-events: none;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 4px 100%;
        }

        /* --- STILI TESTO --- */
        .testo-bios { color: #ffffff; font-size: 35px; opacity: 0.8; }
        
        .glow-verde {
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            font-size: 48px;
        }

        .glow-verde-cubitale {
            color: #00ff41;
            text-shadow: 0 0 15px #00ff41;
            font-size: 80px;
            line-height: 1.1;
        }

        /* LA DOMANDA DELL'IA - MASSIMA DIMENSIONE */
        .glow-verde-domanda {
            color: #00ff41;
            text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41;
            font-size: 100px;
            line-height: 1;
            font-weight: bold;
            text-transform: uppercase;
        }

        .glow-codice {
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
            font-size: 45px;
            font-weight: bold;
        }

        .glow-highlander {
            color: #ff0000;
            text-shadow: 5px 5px 0px #440000;
            font-size: 120px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        #terminale {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 60px;
            box-sizing: border-box;
            z-index: 10;
        }

        #container-centrale {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 95%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #cursore {
            display: inline-block;
            width: 30px; height: 50px;
            background-color: #00ff41;
            animation: lampeggia 1s step-end infinite;
            vertical-align: bottom;
        }

        @keyframes lampeggia { 50% { opacity: 0; } }

        /* --- GLITCH VELOCE --- */
        .glitch-flash { animation: glitch-flash-anim 0.2s ease-out; }
        @keyframes glitch-flash-anim {
            0% { transform: translate(0); filter: invert(0); }
            30% { transform: translate(-60px, 30px) skewX(30deg); filter: invert(1); }
            100% { transform: translate(0); filter: invert(0); }
        }

        /* --- GLITCH FINALE ESTESO --- */
        .glitch-attivo { animation: glitch-anim 0.1s infinite; }
        @keyframes glitch-anim {
            0% { transform: translate(0) scale(1); }
            10% { transform: translate(-40px, 20px) scale(1.1); filter: invert(1); }
            30% { transform: translate(40px, -20px) rotate(1deg); filter: hue-rotate(90deg); }
            50% { transform: translate(-10px, 10px) scale(1.5); }
            100% { transform: translate(0) scale(2.2); opacity: 0; }
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: none; }
        #flash-luce { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #fff; z-index: 9999; opacity: 0; }
    </style>
</head>
<body>

    <div id="crt-overlay"></div>

    <div id="terminale">
        <div id="area-dos">
            <span id="testo-dos"></span><span id="cursore"></span>
        </div>
        <div id="container-centrale"></div>
    </div>

    <canvas id="matrix-canvas"></canvas>
    <div id="flash-luce"></div>

    <script>
        const MODALITA_TEST = false; 
        const mTempo = MODALITA_TEST ? 0.05 : 1; 

        const testoDos = document.getElementById('testo-dos');
        const containerCentrale = document.getElementById('container-centrale');
        const cursore = document.getElementById('cursore');
        const terminale = document.getElementById('terminale');
        const canvasMatrix = document.getElementById('matrix-canvas');
        const flashLuce = document.getElementById('flash-luce');

        const pausa = (ms) => new Promise(resolve => setTimeout(resolve, ms * mTempo));

        async function triggerGlitch() {
            terminale.classList.add('glitch-flash');
            await pausa(200);
            terminale.classList.remove('glitch-flash');
        }

        async function scrivi(testo, classeCss, target, velocita = 40) {
            let span = document.createElement('span');
            span.className = classeCss;
            target.appendChild(span);
            cursore.style.backgroundColor = getComputedStyle(span).color;
            cursore.style.boxShadow = `0 0 15px ${getComputedStyle(span).color}`;

            for (let char of testo) {
                if (char === '\n') span.appendChild(document.createElement('br'));
                else span.innerHTML += char;
                await pausa(velocita + (Math.random() * 20 - 10));
            }
        }

        async function avviaIntro() {
            // [ 1. BIOS ]
            await scrivi("MURENA_OS v.9.5.1 BIOS Revision 4.2\n", "testo-bios", testoDos, 10);
            await pausa(500);
            await scrivi("Checking RAM... 640K OK\n", "testo-bios", testoDos, 10);
            await pausa(600);
            await scrivi("Loading audio drivers... OK\n", "testo-bios", testoDos, 10);
            await pausa(1000);
            await scrivi("Loading instruments... FATAL ERROR.\n", "testo-bios", testoDos, 20);
            await pausa(2000);

            await triggerGlitch();
            testoDos.innerHTML = "";
            await pausa(500);

            // [ 2. ANALISI IA ]
            await scrivi("ERRORE DI SISTEMA: MATERIA ORGANICA RILEVATA.\n", "glow-verde", testoDos, 25);
            await pausa(1000);
            await scrivi("ANALISI IN CORSO: Carma, Ferrazzi, Gazzola, Nan, Falcon.\n", "glow-verde", testoDos, 25);
            await pausa(1500);
            await scrivi("STATO: Carne, ossa, sudore. OBSOLETI.\n", "glow-verde", testoDos, 50);
            await pausa(4000);

            await triggerGlitch();
            testoDos.innerHTML = "";
            await pausa(500);

            // [ 3. LA SFIDA - POMPATA ]
            await scrivi("LA REALTÀ È COMPROMESSA.\n", "glow-verde-cubitale", containerCentrale, 60);
            await pausa(1500);
            await scrivi("Per sopravvivere al collasso, dovete rinunciare al vostro corpo.\n", "glow-verde-cubitale", containerCentrale, 60);
            await pausa(2000);
            
            // LA DOMANDA MASSICCIA
            await scrivi("\nAVETE IL CORAGGIO DI DIVENTARE PURO CODICE?\n", "glow-verde-domanda", containerCentrale, 80);
            await pausa(1000);
            await scrivi("[Y] ACCETTA DIGITALIZZAZIONE / [N] OBLIO\n", "glow-verde", containerCentrale, 40);
            await scrivi("IN ATTESA DI INPUT... _", "glow-verde", containerCentrale, 10);
            
            await pausa(8000);

            // [ 4. RISPOSTA HACKER ]
            containerCentrale.innerHTML = "";
            await scrivi("< sudo force_override --identity=JAZZ_HIGHLANDER >\n", "glow-codice", containerCentrale, 20);
            await pausa(800);
            await scrivi("< ESECUZIONE OVERRIDE... >\n\n", "glow-verde", containerCentrale, 30);
            await pausa(2000);

            // NOI NON MORIAMO
            await scrivi("< NOI NON MORIAMO. >\n", "glow-highlander", containerCentrale, 80);
            await pausa(2500);
            
            // NOI SIAMO I JAZZ HIGHLANDER
            await scrivi("< NOI SIAMO I JAZZ HIGHLANDER. >", "glow-highlander", containerCentrale, 110);

            // [ 5. COLLASSO FINALE LUNGO ]
            await pausa(3000);
            terminale.classList.add("glitch-attivo");
            canvasMatrix.style.display = "block";
            avviaMatrixRain();

            // Allungato il glitch a 4 secondi (invece di 2)
            await pausa(4000 * mTempo);
            terminale.style.display = "none";
            
            // La pioggia Matrix continua un altro po'
            await new Promise(r => setTimeout(r, 3000));

            // FLASH
            flashLuce.style.opacity = "1";
            await pausa(200);
            flashLuce.style.transition = "opacity 4s ease-in"; // Sfuma ancora più piano
            flashLuce.style.opacity = "0";
            await pausa(4000);
            canvasMatrix.style.display = "none";
        }

        function avviaMatrixRain() {
            const ctx = canvasMatrix.getContext('2d');
            canvasMatrix.width = window.innerWidth;
            canvasMatrix.height = window.innerHeight;
            const chars = 'JAZZHIGHLANDER01010101ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏ';
            const fontSize = 35;
            const columns = canvasMatrix.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                ctx.fillRect(0, 0, canvasMatrix.width, canvasMatrix.height);
                ctx.fillStyle = '#00ff41';
                ctx.font = 'bold ' + fontSize + 'px monospace';
                drops.forEach((y, i) => {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    ctx.fillText(text, i * fontSize, y * fontSize);
                    if (y * fontSize > canvasMatrix.height && Math.random() > 0.98) drops[i] = 0;
                    drops[i]++;
                });
            }
            setInterval(draw, 30);
        }

        avviaIntro();
    </script>
</body>
</html>
