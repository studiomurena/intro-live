<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Murena - Jazz Highlander Final Intro</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden; 
            font-family: 'VT323', monospace;
        }

        /* --- EFFETTI MONITOR CRT --- */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 900;
            pointer-events: none;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 4px 100%;
        }

        #crt-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 901;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);
        }

        /* --- TERMINALE --- */
        #terminale {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 60px;
            box-sizing: border-box;
            z-index: 10;
            animation: flicker-monitor 0.2s infinite;
        }

        /* Container per centrare le frasi finali */
        #container-centrale {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
        }

        @keyframes flicker-monitor { 0% { opacity: 0.97; } 50% { opacity: 1; } 100% { opacity: 0.98; } }

        .testo-bianco { color: #ececec; font-size: 42px; text-shadow: -1px 0 1px red, 1px 0 1px blue; }
        .testo-verde { color: #39ff14; font-size: 48px; text-shadow: 0 0 8px rgba(57,255,20,0.5); }
        .testo-verde-grande { color: #39ff14; font-size: 65px; text-shadow: 0 0 12px rgba(57,255,20,0.7); }
        
        /* Stile per il gran finale */
        .testo-finale { 
            color: #ff003c; 
            font-size: 90px; 
            text-shadow: 0 0 25px rgba(255,0,60,1), -4px 0 2px rgba(0,255,0,0.5), 4px 0 2px rgba(0,0,255,0.5); 
            font-weight: bold;
            display: block;
            margin-bottom: 20px;
        }
        
        #cursore {
            display: inline-block;
            width: 25px; height: 45px;
            background-color: #39ff14;
            animation: lampeggia 1s step-end infinite;
            vertical-align: bottom;
            box-shadow: 0 0 10px #39ff14;
        }

        @keyframes lampeggia { 50% { opacity: 0; } }

        /* --- GLITCH --- */
        .glitch-attivo { animation: glitch-anim 0.15s infinite; }

        @keyframes glitch-anim {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-30px, 20px); filter: invert(1); letter-spacing: 10px; }
            40% { transform: translate(30px, -20px) skew(20deg); }
            60% { transform: translate(-40px, 0); filter: hue-rotate(180deg); }
            100% { transform: translate(0) scale(1.8); opacity: 0; }
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: none; }
        #flash-luce { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #fff; z-index: 9999; opacity: 0; transition: opacity 0.1s ease-out; }
    </style>
</head>
<body>

    <div id="crt-overlay"></div>
    <div id="crt-vignette"></div>

    <div id="terminale">
        <div id="area-testo">
            <span id="testo-schermo"></span><span id="cursore"></span>
        </div>
        <div id="container-centrale"></div>
    </div>

    <canvas id="matrix-canvas"></canvas>
    <div id="flash-luce"></div>

    <script>
        const MODALITA_TEST = false; 
        const mTempo = MODALITA_TEST ? 0.1 : 1; 

        const terminaleDiv = document.getElementById('terminale');
        const testoSchermo = document.getElementById('testo-schermo');
        const containerCentrale = document.getElementById('container-centrale');
        const cursore = document.getElementById('cursore');
        const canvasMatrix = document.getElementById('matrix-canvas');
        const flashLuce = document.getElementById('flash-luce');

        const pausa = (ms) => new Promise(resolve => setTimeout(resolve, ms * mTempo));

        async function scrivi(testo, classeCss, target, ritardoTasto = 40) {
            let bloccoTesto = document.createElement('span');
            bloccoTesto.className = classeCss;
            target.appendChild(bloccoTesto);
            cursore.style.backgroundColor = getComputedStyle(bloccoTesto).color;
            cursore.style.boxShadow = `0 0 10px ${getComputedStyle(bloccoTesto).color}`;

            for (let i = 0; i < testo.length; i++) {
                if (testo[i] === '\n') {
                    bloccoTesto.appendChild(document.createElement('br'));
                } else {
                    bloccoTesto.innerHTML += testo[i];
                }
                await pausa(ritardoTasto + (Math.random() * 30 - 15));
            }
        }

        async function avviaIntro() {
            // [ BOOT ]
            await scrivi("MURENA_OS v.9.5.1 BIOS Revision 4.2\n", "testo-bianco", testoSchermo, 15);
            await pausa(1000);
            await scrivi("Loading audio drivers... OK\n", "testo-bianco", testoSchermo, 15);
            await pausa(2500);
            await scrivi("FATAL ERROR.\n", "testo-bianco", testoSchermo, 15);
            await pausa(3000);
            
            testoSchermo.innerHTML = "";
            await pausa(2000);

            // [ IA ANALYSIS ]
            await scrivi("> INIZIALIZZAZIONE PROTOCOLLO DI PURGA.\n", "testo-verde", testoSchermo, 60);
            await pausa(1500);
            await scrivi("> Target agganciati: CARMA, FERRAZ, MAURI, NAN, FALCON.\n", "testo-verde", testoSchermo, 40);
            await pausa(2000);
            await scrivi("> ERRORE: LA CARNE È DEBOLE.\n", "testo-verde", testoSchermo, 80);
            await pausa(3000);

            // [ LA SFIDA ]
            testoSchermo.innerHTML = ""; 
            await scrivi("ACCETTATE LA DIGITALIZZAZIONE?\n", "testo-verde-grande", testoSchermo, 80);
            await scrivi("Digitare [Y] per trascendere - [N] per morire.\n", "testo-verde-grande", testoSchermo, 80);
            await scrivi("> ", "testo-verde-grande", testoSchermo, 20);
            
            await pausa(6000); 

            // [ OVERRIDE & GRAN FINALE ]
            await scrivi("Y\n", "testo-finale", testoSchermo, 200);
            await pausa(1500);
            
            // PULIZIA TOTALE PER IL MESSAGGIO FINALE
            testoSchermo.innerHTML = "";
            cursore.style.display = "none";
            await pausa(1000);

            // FRASI A TUTTO SCHERMO CENTRATE
            await scrivi("> NOI NON VENIAMO CANCELLATI", "testo-finale", containerCentrale, 100);
            await pausa(1500);
            containerCentrale.appendChild(document.createElement('br'));
            await scrivi("> NOI SIAMO I JAZZ HIGHLANDER", "testo-finale", containerCentrale, 120);

            // [ IL COLLASSO ]
            await pausa(2000);
            terminaleDiv.classList.add("glitch-attivo");
            canvasMatrix.style.display = "block";
            avviaMatrixRain();

            await pausa(1800 * mTempo); 
            terminaleDiv.style.display = "none";
            await pausa(2500); 

            // FLASH FINALE
            flashLuce.style.opacity = "1";
            await pausa(150);
            flashLuce.style.transition = "opacity 3s ease-in";
            flashLuce.style.opacity = "0";
            await pausa(3000);
            canvasMatrix.style.display = "none";
        }

        function avviaMatrixRain() {
            const ctx = canvasMatrix.getContext('2d');
            canvasMatrix.width = window.innerWidth;
            canvasMatrix.height = window.innerHeight;
            const caratteri = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓ';
            const fontSize = 30;
            const colonne = canvasMatrix.width / fontSize;
            const gocce = Array(Math.floor(colonne)).fill(1);

            function disegna() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvasMatrix.width, canvasMatrix.height);
                ctx.fillStyle = '#39ff14';
                ctx.font = fontSize + 'px monospace';
                gocce.forEach((y, i) => {
                    const testo = caratteri.charAt(Math.floor(Math.random() * caratteri.length));
                    ctx.fillText(testo, i * fontSize, y * fontSize);
                    if (y * fontSize > canvasMatrix.height && Math.random() > 0.975) gocce[i] = 0;
                    gocce[i]++;
                });
            }
            setInterval(disegna, 30);
        }

        avviaIntro();
    </script>
</body>
</html>
