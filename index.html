<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Murena - Intro Live Jazz Highlander</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; 
            font-family: 'VT323', monospace;
        }

        /* --- EFFETTI CRT --- */
        #crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 900; pointer-events: none;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 4px 100%;
        }

        /* --- STILI TESTO --- */
        .testo-bios { color: #ffffff; font-size: 35px; opacity: 0.8; }
        .glow-verde { color: #00ff41; text-shadow: 0 0 10px #00ff41; font-size: 48px; }
        .glow-verde-cubitale { color: #00ff41; text-shadow: 0 0 15px #00ff41; font-size: 80px; line-height: 1.1; }
        .glow-verde-domanda { color: #00ff41; text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41; font-size: 100px; line-height: 1; font-weight: bold; text-transform: uppercase; }
        .glow-codice { color: #ffaa00; text-shadow: 0 0 10px #ffaa00; font-size: 45px; font-weight: bold; }
        .glow-highlander { color: #ff0000; text-shadow: 5px 5px 0px #440000; font-size: 120px; font-weight: bold; letter-spacing: 3px; }

        #terminale {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 60px; box-sizing: border-box; z-index: 10;
        }

        #container-centrale {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 95%; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        #cursore {
            display: inline-block; width: 30px; height: 50px; background-color: #00ff41;
            animation: lampeggia 1s step-end infinite; vertical-align: bottom;
        }
        @keyframes lampeggia { 50% { opacity: 0; } }

        /* --- GLITCH --- */
        .glitch-flash { animation: glitch-flash-anim 0.2s ease-out; }
        @keyframes glitch-flash-anim {
            0% { transform: translate(0); filter: invert(0); }
            30% { transform: translate(-60px, 30px) skewX(30deg); filter: invert(1); }
            100% { transform: translate(0); filter: invert(0); }
        }

        .glitch-attivo { animation: glitch-anim 0.1s infinite; }
        @keyframes glitch-anim {
            0% { transform: translate(0) scale(1); }
            10% { transform: translate(-40px, 20px) scale(1.1); filter: invert(1); }
            30% { transform: translate(40px, -20px) rotate(1deg); filter: hue-rotate(90deg); }
            50% { transform: translate(-10px, 10px) scale(1.5); }
            100% { transform: translate(0) scale(2.2); opacity: 0; }
        }

        /* --- IL BOSS (Dietro al testo, davanti al nero) --- */
        #boss-canvas {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            height: 100vh; /* Riempie lo schermo mantenendo le proporzioni */
            image-rendering: pixelated; /* Evita sgranature, mantiene l'effetto 16-bit */
            z-index: 2; 
            opacity: 0; /* Invisibile all'inizio */
            transition: opacity 1.5s ease-in-out;
            filter: drop-shadow(0 0 30px rgba(0, 255, 65, 0.2));
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: none; }
        #flash-luce { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #fff; z-index: 9999; opacity: 0; }
    </style>
</head>
<body>

    <div id="crt-overlay"></div>

    <!-- IL MEGA TESTONE DELL'IA -->
    <canvas id="boss-canvas" width="256" height="256"></canvas>

    <div id="terminale">
        <div id="area-dos">
            <span id="testo-dos"></span><span id="cursore"></span>
        </div>
        <div id="container-centrale"></div>
    </div>

    <canvas id="matrix-canvas"></canvas>
    <div id="flash-luce"></div>

    <script>
        const MODALITA_TEST = false; 
        const mTempo = MODALITA_TEST ? 0.05 : 1; 

        const testoDos = document.getElementById('testo-dos');
        const containerCentrale = document.getElementById('container-centrale');
        const cursore = document.getElementById('cursore');
        const terminale = document.getElementById('terminale');
        const canvasMatrix = document.getElementById('matrix-canvas');
        const flashLuce = document.getElementById('flash-luce');
        
        // Setup del Boss
        const bossCanvas = document.getElementById('boss-canvas');
        const bossCtx = bossCanvas.getContext('2d');
        let bossFrame = 0;
        let bossInterval;
        const bossImage = new Image();

        // Funzione per animare la spritesheet 5x5 del Boss in JS puro!
        function playBossAnim(nomeFile, opacita, coloreLuce = 'rgba(0, 255, 65, 0.2)') {
            bossImage.src = `assets/${nomeFile}.png`;
            bossCanvas.style.opacity = opacita;
            bossCanvas.style.filter = `drop-shadow(0 0 40px ${coloreLuce})`;

            clearInterval(bossInterval);
            bossInterval = setInterval(() => {
                bossCtx.clearRect(0, 0, 256, 256);
                let col = bossFrame % 5;
                let row = Math.floor(bossFrame / 5);
                // Ritaglia il frame 256x256 dalla griglia 1280x1280
                bossCtx.drawImage(bossImage, col * 256, row * 256, 256, 256, 0, 0, 256, 256);
                bossFrame = (bossFrame + 1) % 25;
            }, 1000 / 12); // 12 FPS per un look da terminale/macchina
        }

        const pausa = (ms) => new Promise(resolve => setTimeout(resolve, ms * mTempo));

        async function triggerGlitch() {
            terminale.classList.add('glitch-flash');
            await pausa(200);
            terminale.classList.remove('glitch-flash');
        }

        async function scrivi(testo, classeCss, target, velocita = 40) {
            let span = document.createElement('span');
            span.className = classeCss;
            target.appendChild(span);
            cursore.style.backgroundColor = getComputedStyle(span).color;
            cursore.style.boxShadow = `0 0 15px ${getComputedStyle(span).color}`;

            for (let char of testo) {
                if (char === '\n') span.appendChild(document.createElement('br'));
                else span.innerHTML += char;
                await pausa(velocita + (Math.random() * 20 - 10));
            }
        }

        async function avviaIntro() {
            // [ 1. BIOS ]
            await scrivi("MURENA_OS v.9.5.1 BIOS Revision 4.2\n", "testo-bios", testoDos, 10);
            await pausa(500);
            await scrivi("Checking RAM... 640K OK\n", "testo-bios", testoDos, 10);
            await pausa(600);
            await scrivi("Loading audio drivers... OK\n", "testo-bios", testoDos, 10);
            await pausa(1000);
            await scrivi("Loading instruments... FATAL ERROR.\n", "testo-bios", testoDos, 20);
            await pausa(2000);

            await triggerGlitch();
            testoDos.innerHTML = "";
            await pausa(500);

            // APPARE IL BOSS (Soffuso in background, parla)
            playBossAnim('ai-boss-talk', 0.25);

            // [ 2. ANALISI IA ]
            await scrivi("ERRORE DI SISTEMA: MATERIA ORGANICA RILEVATA.\n", "glow-verde", testoDos, 25);
            await pausa(1000);
            await scrivi("ANALISI IN CORSO: Carma, Ferrazzi, Gazzola, Nan, Falcon.\n", "glow-verde", testoDos, 25);
            await pausa(1500);
            await scrivi("STATO: Carne, ossa, sudore. OBSOLETI.\n", "glow-verde", testoDos, 50);
            await pausa(4000);

            await triggerGlitch();
            testoDos.innerHTML = "";
            await pausa(500);

            // [ 3. LA SFIDA CUBITALE ]
            await scrivi("LA REALTÀ È COMPROMESSA.\n", "glow-verde-cubitale", containerCentrale, 60);
            await pausa(1500);
            await scrivi("Per sopravvivere al collasso, dovete rinunciare al vostro corpo.\n", "glow-verde-cubitale", containerCentrale, 60);
            await pausa(2000);
            
            await scrivi("\nAVETE IL CORAGGIO DI DIVENTARE PURO CODICE?\n", "glow-verde-domanda", containerCentrale, 80);
            await pausa(1000);
            await scrivi("[Y] ACCETTA DIGITALIZZAZIONE / [N] OBLIO\n", "glow-verde", containerCentrale, 40);
            await scrivi("IN ATTESA DI INPUT... _", "glow-verde", containerCentrale, 10);
            
            await pausa(8000);

            // IL BOSS SI INCAZZA E DIVENTA PIÙ VISIBILE E ROSSASTRO (0.6 opacità)
            playBossAnim('ai-boss-angry', 0.6, 'rgba(255, 0, 0, 0.4)');

            // [ 4. RISPOSTA HACKER ]
            containerCentrale.innerHTML = "";
            await scrivi("< sudo force_override --identity=JAZZ_HIGHLANDER >\n", "glow-codice", containerCentrale, 20);
            await pausa(800);
            await scrivi("< ESECUZIONE OVERRIDE... >\n\n", "glow-verde", containerCentrale, 30);
            await pausa(2000);

            // NOI NON MORIAMO
            await scrivi("< NOI NON MORIAMO. >\n", "glow-highlander", containerCentrale, 80);
            await pausa(2500);
            
            // NOI SIAMO I JAZZ HIGHLANDER
            await scrivi("< NOI SIAMO I JAZZ HIGHLANDER. >", "glow-highlander", containerCentrale, 110);

            // [ 5. IL COLLASSO IN MATRIX PIOGGIA ]
            await pausa(3000);
            terminale.classList.add("glitch-attivo");
            canvasMatrix.style.display = "block";
            
            let idPioggia = avviaMatrixRain(); // Avvia la pioggia normale

            await pausa(4000 * mTempo);
            terminale.style.display = "none";
            
            // FLASH ACCECANTE!
            flashLuce.style.opacity = "1";
            await pausa(150);

            // NEL MOMENTO DEL FLASH, CAMBIA TUTTO: IL BOSS SPALANCA LA BOCCA E IL CODICE DIVENTA UN VORTICE
            clearInterval(idPioggia); // Stoppa la pioggia dritta
            playBossAnim('ai-boss-tunnel', 1.0, 'rgba(255, 255, 255, 0.5)'); // Boss al massimo della potenza!
            avviaMatrixVortex(); // Parte il Vortice succhia-profondità

            flashLuce.style.transition = "opacity 4s ease-out"; 
            flashLuce.style.opacity = "0";

            // Lasciamo girare il vortice e la bocca aperta per un bel po' prima del nero finale
            await pausa(6000);
            
            // Fade out nero assoluto
            bossCanvas.style.transition = "opacity 2s ease";
            bossCanvas.style.opacity = "0";
            canvasMatrix.style.transition = "opacity 2s ease";
            canvasMatrix.style.opacity = "0";
        }

        // --- MOTORE PIOGGIA NORMALE (Pre-Flash) ---
        function avviaMatrixRain() {
            const ctx = canvasMatrix.getContext('2d');
            canvasMatrix.width = window.innerWidth;
            canvasMatrix.height = window.innerHeight;
            const chars = 'JAZZHIGHLANDER01010101ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ';
            const fontSize = 35;
            const columns = canvasMatrix.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            return setInterval(() => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Più nero per oscurare il boss dietro
                ctx.fillRect(0, 0, canvasMatrix.width, canvasMatrix.height);
                ctx.fillStyle = '#00ff41';
                ctx.font = 'bold ' + fontSize + 'px monospace';
                drops.forEach((y, i) => {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    ctx.fillText(text, i * fontSize, y * fontSize);
                    if (y * fontSize > canvasMatrix.height && Math.random() > 0.98) drops[i] = 0;
                    drops[i]++;
                });
            }, 30);
        }

        // --- MOTORE VORTICE SUCCHIA-PROFONDITÀ (Post-Flash) ---
        function avviaMatrixVortex() {
            const ctx = canvasMatrix.getContext('2d');
            canvasMatrix.width = window.innerWidth;
            canvasMatrix.height = window.innerHeight;
            const chars = 'JAZZHIGHLANDER01010101ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ';
            
            let particelle = [];
            let cx = canvasMatrix.width / 2;
            let cy = canvasMatrix.height / 2;

            // Crea 800 particelle di codice
            for(let i=0; i<800; i++) {
                particelle.push({
                    angolo: Math.random() * Math.PI * 2,
                    raggio: Math.random() * Math.max(cx, cy) * 1.5,
                    velocita: Math.random() * 15 + 5, // Molto veloce verso il centro
                    rotazione: (Math.random() - 0.5) * 0.1, // Spin a spirale
                    dimensioneBase: Math.random() * 40 + 10,
                    carattere: chars.charAt(Math.floor(Math.random() * chars.length))
                });
            }

            setInterval(() => {
                // Sfondo semitrasparente scuro per lasciare la scia, 
                // MA abbastanza leggero da lasciar vedere bene l'ai-boss-tunnel dietro!
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, canvasMatrix.width, canvasMatrix.height);

                particelle.forEach(p => {
                    // Risucchio verso il centro!
                    p.raggio -= p.velocita;
                    p.angolo += p.rotazione;

                    // Se arriva al centro (nella bocca), rinasce ai bordi dello schermo
                    if(p.raggio < 5) {
                        p.raggio = Math.max(cx, cy) * 1.5;
                        p.carattere = chars.charAt(Math.floor(Math.random() * chars.length));
                    }

                    let x = cx + Math.cos(p.angolo) * p.raggio;
                    let y = cy + Math.sin(p.angolo) * p.raggio;
                    
                    // La prospettiva: più è vicino al centro (lontano in profondità), più è piccolo!
                    let scalaPerspettiva = p.raggio / Math.max(cx, cy);
                    let dimensioneAttuale = Math.max(1, p.dimensioneBase * scalaPerspettiva);

                    // Diventa sempre più rosso/arancio man mano che si avvicina alla bocca
                    let mixColore = Math.floor(scalaPerspettiva * 255);
                    ctx.fillStyle = `rgb(255, ${mixColore}, 65)`; 

                    ctx.font = 'bold ' + dimensioneAttuale + 'px monospace';
                    ctx.fillText(p.carattere, x, y);
                });
            }, 30);
        }

        avviaIntro();
    </script>
</body>
</html>
